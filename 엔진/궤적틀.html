<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<title>궤적 · 백로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

:root{
 --bg:#eef1f4;--panel:#ffffff;--ink:#17202b;--soft:#566170;--line:#d8dee6;   
 --accent:#2f5fa8;--now:#c2453d;--done:#257355;--parked:#875810;--due:#8a4fb4;
 --deep:#4a5a75;--deepbg:#eef2f8;
 --display:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;   
 --body:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
 --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
 --lane:46px;--railw:150px;
 
 --l0:#18843f;--l1:#2a63d4;--lm:#b95a10;--onl:#ffffff;--station:#ffffff;--railbg:#e4ebf3;--street:#f4f7fa;--car:#cfd7e0;--glass:#27313b;
 --side:#dfe5ec;--front:#c9d2dc;--lamp:#fff6c8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#10151c;--panel:#18202a;--ink:#e6ebf1;--soft:#93a0b0;--line:#283240;
 --accent:#7fa8ec;--now:#ec7e75;--done:#5fc49a;--parked:#e3b05c;--due:#c39be4;
 --deep:#a9b8d4;--deepbg:#1d2533;
 --l0:#3cc46a;--l1:#6c9cff;--lm:#ff9a4a;--onl:#0d1418;--station:#eef3f7;--railbg:#151d27;--street:#1c2632;--car:#9aa6b3;--glass:#1b222a;
 --side:#b7c2cd;--front:#98a5b2;--lamp:#fff3b0;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10151c;--panel:#18202a;--ink:#e6ebf1;--soft:#93a0b0;--line:#283240;
 --accent:#7fa8ec;--now:#ec7e75;--done:#5fc49a;--parked:#e3b05c;--due:#c39be4;
 --deep:#a9b8d4;--deepbg:#1d2533;
 --l0:#3cc46a;--l1:#6c9cff;--lm:#ff9a4a;--onl:#0d1418;--station:#eef3f7;--railbg:#151d27;--street:#1c2632;--car:#9aa6b3;--glass:#1b222a;
 --side:#b7c2cd;--front:#98a5b2;--lamp:#fff3b0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 60px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}


h1{font-family:var(--display);font-size:clamp(1.55rem,1rem + 2.2vw,2.3rem);font-weight:900;letter-spacing:-.03em;line-height:1.2;color:#f3f6fa;background:#141b23;border:1px solid #2c3746;border-radius:14px;padding:16px 20px 20px;box-shadow:inset 0 -6px 0 var(--l0);margin:.6rem 0 1.1rem;text-wrap:balance}
h1{display:flex;align-items:baseline}
h1::before{content:"·";margin-right:.3em;flex:none}   

.lede{color:color-mix(in srgb,var(--ink) 80%,var(--bg));font-size:1rem;font-weight:500;line-height:1.75;margin:0 0 12px;max-width:62ch;text-wrap:pretty}
.lede.stops{padding-left:30px}
.lede.stops .ll{display:block;position:relative;padding-bottom:6px}
.lede.stops .ll::before{content:"";position:absolute;left:-25px;top:8px;width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:3px solid var(--l0);background:var(--panel);z-index:1;
 animation:stop-pop .45s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.45s + var(--i,0) * .12s)}
.lede.stops .ll:last-child::before{background:var(--l0);width:14px;height:14px;left:-26px;top:7px}
.lede.stops .ll:not(:last-child)::after{content:"";position:absolute;left:-21px;top:14px;bottom:-14px;width:4px;border-radius:2px;background:var(--l0);
 transform-origin:top;animation:seg-draw .3s ease-out both;animation-delay:calc(.5s + var(--i,0) * .12s)}
@keyframes stop-pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes seg-draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.lede.stops .ll::before,.lede.stops .ll::after{animation:none}}

.stamp{margin:2px 0 0;font-size:.8rem;color:#b7c3cf}
.card{scroll-margin-top:calc(var(--striph,104px) + 12px)}   

.tday{flex:none;margin-left:auto;font-size:.8rem;font-weight:700;color:#8fe0a8;white-space:nowrap;align-self:center}
.tday:empty{display:none}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 20px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.76rem;color:var(--soft)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.allbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.76rem;font-weight:700;color:var(--deep);
 background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;cursor:pointer}
.allbtn svg,.lb svg{width:14px;height:14px;transition:transform .2s}
.allbtn[aria-expanded="true"] svg,.lb[aria-expanded="true"] svg{transform:rotate(180deg)}
.allbtn:focus-visible,.lb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.graph{position:relative}
.rails{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.graph::before{content:"";position:absolute;left:4px;top:-12px;bottom:-12px;width:calc(100% - 8px);border-radius:16px;pointer-events:none;   
 background:linear-gradient(90deg,transparent 0 31px,var(--street) 31px 34px) 0 0/34px 34px,linear-gradient(0deg,transparent 0 47px,var(--street) 47px 50px) 0 0/50px 50px,var(--railbg)}
.rail{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.rail.l0{stroke:var(--l0)}.rail.l1{stroke:var(--l1)}.rail.lm{stroke:var(--lm)}
.rail.soon{opacity:.36}
.rail-case{fill:none;stroke:var(--railbg);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.stn{fill:var(--station);stroke-width:3.2}
.stn.l0{stroke:var(--l0)}.stn.l1{stroke:var(--l1)}.stn.lm{stroke:var(--lm)}
.stn.soon{stroke-opacity:.5}
.stn.parked{stroke-dasharray:3.2 2.6}
.term{fill:var(--station);stroke:var(--ink);stroke-width:2.2}
.xfer-in{fill:var(--railbg)}
.xfer-cut{fill:var(--station);stroke:var(--c);stroke-width:3.2;stroke-linejoin:round}   
.xfer-cut.soon{opacity:.55}
.halo{fill:var(--tc);opacity:.17}

.halo-ring{fill:none;stroke:var(--tc);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.train-in .halo-ring,.arrive-pulse .halo-ring{animation:ring .6s cubic-bezier(.16,1,.3,1) 1}
.rails .train.running .halo{opacity:.08}   

.card.fx-done{animation:fxDone .8s ease-out var(--fxd,0ms) both}
.card.fx-done .st{animation:pop .45s cubic-bezier(.34,1.56,.64,1) var(--fxd,0ms) both}
.card.fx-todo,.card.fx-parked{animation:fxFade .6s ease-out var(--fxd,0ms) both}
.card.fx-now{animation:fxNow .9s ease-out var(--fxd,0ms) both}
@keyframes fxDone{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--done) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes fxNow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cl) 60%,transparent)}100%{box-shadow:0 0 0 1.5px var(--cl),0 0 0 14px transparent}}
@keyframes fxFade{0%{opacity:.55}100%{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.card.fx,.card.fx .st{animation:none}}
.backbtn{position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));   
 display:inline-flex;align-items:center;gap:6px;min-height:36px;font:inherit;font-size:.8rem;font-weight:800;color:var(--deep);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;
 box-shadow:0 4px 14px -6px rgba(16,28,40,.35)}
.wrap{padding-block-start:64px}   
.backbtn:disabled{display:none}   
.backbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes ring{0%{opacity:.6;transform:scale(.55)}100%{opacity:0;transform:scale(1.35)}}
.train-in{animation:arrive var(--dur,600ms) cubic-bezier(.16,1,.3,1) both}   
.rails .train:focus-visible{outline:none}
.rails .train:focus-visible .roof{stroke:var(--accent);stroke-width:2.4}
.rails .train.moving{filter:drop-shadow(0 6px 8px rgba(16,28,40,.28))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,6px)}}
@keyframes zoneIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toastIn .2s cubic-bezier(.16,1,.3,1)}
.toast.out{animation:toastOut .15s ease-in forwards}
.trash{animation:zoneIn .2s cubic-bezier(.16,1,.3,1)}
@media (prefers-reduced-motion:reduce){.toast,.toast.out,.trash{animation:none}.trash.over{transform:translateX(-50%)}}
@keyframes arrive{from{transform:translateY(var(--dy))}to{transform:none}}

.roof{fill:var(--station);stroke:var(--car);stroke-width:.8;stroke-linejoin:round}
.side{fill:var(--side);stroke:var(--car);stroke-width:.8;stroke-linejoin:round}
.front{fill:var(--front);stroke:var(--car);stroke-width:.6;stroke-linejoin:round}
.shade{fill:rgba(16,28,40,.16);stroke:rgba(16,28,40,.08);stroke-width:4;stroke-linejoin:round}
.stripe{fill:var(--tc)}
.vent{fill:var(--car);opacity:.6}
.glass{fill:var(--glass)}
.lamp{fill:var(--lamp)}
.rails .train{pointer-events:auto;cursor:grab;touch-action:none}
.rails .train.moving{cursor:grabbing;opacity:.92}
.rails .train.moving .halo-ring{display:none}
@media (prefers-reduced-motion:reduce){.halo-ring{display:none}.train-in{animation:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.8s ease-out infinite}
@keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){.pulse{display:none}.allbtn svg,.lb svg{transition:none}}
.cards{display:flex;flex-direction:column;gap:12px;padding-left:var(--railw)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--soft);
 border-radius:10px;padding:8px 44px 9px 12px;min-width:0}
.card{--cl:var(--l0);border-left-color:var(--cl)}   
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}   
.card[data-lane="1"]{--cl:var(--l1)}.card[data-lane="-1"]{--cl:var(--lm)}
.card.c-todo,.card.c-next{border-left-color:color-mix(in srgb,var(--cl) 40%,var(--line))}
.card.c-now{box-shadow:0 0 0 1.5px var(--cl),0 6px 18px -8px color-mix(in srgb,var(--cl) 60%,transparent)}
.ct{font-weight:700;font-size:.92rem;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;line-height:1.35}
.ct .cq{flex:1 1 0;min-width:0}   
.ax{font-size:.63rem;font-weight:800;color:var(--accent);letter-spacing:.04em;border:1px solid var(--accent);border-radius:5px;padding:0 5px}
.ax.side{color:var(--soft);border-color:var(--line)}
.wh{font-size:.66rem;color:var(--soft);font-family:var(--mono)}
.st{font-size:.72rem;font-weight:800;border-radius:5px;padding:1px 6px;color:var(--panel)}
.st-goal{background:var(--accent)}.st-now{background:var(--now)}
.st-next{background:var(--panel);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}   
.st-done{background:var(--done)}.st-todo{background:var(--soft)}.st-parked{background:var(--parked)}
.dday{font-size:.66rem;font-weight:800;color:var(--due);border:1px solid var(--due);border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums}
.here{font-size:.7rem;font-weight:800;color:var(--cl)}
.lpill{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--ink)}
.lpill b{display:inline-grid;place-items:center;min-width:34px;height:20px;padding:0 9px;border-radius:10px;color:var(--onl);font-size:.74rem}
.lpill.l0 b{background:var(--l0)}.lpill.l1 b{background:var(--l1)}.lpill.lm b{background:var(--lm)}
.lkey{display:inline-flex;align-items:center;gap:5px}
.lkey svg{width:16px;height:16px;flex:none}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px}

.csum{list-style:none;margin:3px 0 0;padding:0;max-width:68ch}
.csum li{position:relative;padding-left:14px;margin:0 0 1px;font-size:.8rem;font-weight:400;line-height:1.45;color:var(--ink)}   
.csum li::before{content:"·";position:absolute;left:3px;font-weight:800;color:var(--soft)}
.csum b{font-weight:800;color:var(--ink)}
.sec{min-width:0}
.sh{font-size:.72rem;font-weight:800;color:var(--ink)}
ul.cn{margin:1px 0 0;padding:0;list-style:none;color:var(--soft);font-size:.8rem;line-height:1.45}
ul.cn li{position:relative;padding-left:12px}
ul.cn li::before{content:"·";position:absolute;left:2px;font-weight:800;color:var(--ink)}
.lb{position:absolute;right:8px;top:6px;width:28px;height:28px;display:grid;place-items:center;padding:0;color:var(--deep);
 background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer}
.lb[aria-expanded="true"]{border-color:var(--deep);background:var(--deepbg)}
.deep{margin-top:7px;background:var(--deepbg);border-left:2px solid var(--deep);border-radius:6px;padding:6px 10px;max-width:80ch}
.deep ul.cn{color:var(--ink);opacity:.88}
.foot{color:var(--soft);font-size:.75rem;margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
.foot code{font-family:var(--mono);font-size:.72rem;overflow-wrap:anywhere}
.card code,.np-sum code{font-family:var(--mono);font-size:.9em;overflow-wrap:anywhere}

.card.can-drag{cursor:grab;-webkit-touch-callout:none}
.card.dragging{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.22),0 0 0 2px var(--accent)}
body.drag,body.drag *{cursor:grabbing!important;user-select:none}
.dropline{position:absolute;right:0;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--accent);pointer-events:none}

.trash{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;display:grid;place-items:center;
 width:64px;height:64px;border:2px dashed var(--now);border-radius:50%;background:var(--panel);color:var(--now);
 box-shadow:0 6px 20px rgba(0,0,0,.15);pointer-events:none;transition:background .12s,color .12s,transform .12s}
.trash svg{width:28px;height:28px}

.rails .ins{pointer-events:auto;cursor:pointer}
.rails .hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke}
.rails .plus{opacity:0;transition:opacity .12s}   
.rails .ins:hover .plus,.rails .ins:focus .plus,.rails .ins.on .plus{opacity:1}
.rails .ins:focus{outline:none}
.rails .ins:focus-visible .plus circle{stroke:var(--accent);stroke-width:3}

.rails .dothit{fill:transparent;pointer-events:all;cursor:grab;touch-action:pan-y}   
.rails .ghost{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;pointer-events:none}
.rails .band{fill:var(--accent);opacity:.13;pointer-events:none}
.rails .ring{fill:none;stroke:var(--accent);stroke-width:3;pointer-events:none}
.card.slot{border:2px dashed var(--accent);border-left-width:2px;cursor:auto}
.card.fresh{border-style:dashed;border-left-style:solid}
.fresh-tag{font-size:.63rem;font-weight:800;color:var(--accent);border:1px dashed var(--accent);border-radius:5px;padding:0 5px}
.slot-h{font-size:.78rem;font-weight:800;color:var(--accent)}

.askbtn{position:absolute;right:8px;bottom:6px;width:28px;height:28px;display:grid;place-items:center;padding:0;color:var(--accent);
 background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer}
.askbtn svg{width:14px;height:14px}
.askbtn:hover,.askbtn[aria-expanded="true"]{border-color:var(--accent);background:var(--deepbg)}
.askbtn:focus-visible,.ask button:focus-visible,.ask textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (hover:hover){.askbtn{opacity:0;transition:opacity .15s}.card:hover .askbtn,.card:focus-within .askbtn,.askbtn[aria-expanded="true"]{opacity:1}}
.card .ask{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.answer{background:var(--deepbg);border-left:2px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:.82rem;color:var(--ink);white-space:pre-wrap;max-width:80ch}
.ask{display:flex;flex-direction:column;gap:6px;cursor:auto}
.ask textarea{font:inherit;font-size:.82rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;resize:vertical;min-height:2.6em;width:100%}
.askrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ask button{font:inherit;font-size:.74rem;font-weight:800;border-radius:999px;padding:2px 12px;cursor:pointer;border:1px solid var(--accent);background:none;color:var(--accent)}
.ask button.main{background:var(--accent);color:var(--panel)}
.ask button:disabled{opacity:.5;cursor:default}
.askmsg{font-size:.74rem;color:var(--soft)}
.prop{background:var(--deepbg);border-left:2px solid var(--accent);border-radius:6px;padding:8px 10px}
.prop .ct{margin-bottom:2px}
.trash.over{background:var(--now);color:var(--panel);border-style:solid;transform:translateX(-50%) scale(1.06)}

body.two-zones .trash:not(.aidrop){left:calc(50% - 64px)}
.trash.aidrop{left:calc(50% + 46px);width:auto;padding:0 18px;border-radius:32px;border-color:var(--accent);color:var(--accent);gap:6px;font-weight:800;font-size:.85rem;grid-auto-flow:column}
.trash.aidrop svg{width:18px;height:18px}
.trash.aidrop.over{background:var(--accent);color:var(--panel)}
.card.dragging.to-trash{opacity:.55}
.binbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.76rem;font-weight:700;color:var(--soft);
 background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.binbtn svg{width:14px;height:14px;flex:none}
.binbtn[hidden]{display:none}
.binbtn:focus-visible,.bin button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bin{margin:-8px 0 18px;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.bin ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.bin li{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--soft);min-width:0}
.bin li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:line-through}
.bin li button{flex:none;font:inherit;font-size:.72rem;font-weight:800;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:1px 10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;
 max-width:calc(100% - 32px);background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 10px 8px 14px;font-size:.8rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{font:inherit;font-weight:800;color:var(--panel);background:none;border:1px solid currentColor;border-radius:999px;padding:1px 12px;min-height:44px;cursor:pointer;flex:none}   
@media (max-width:520px){.toast{flex-wrap:wrap}.toast span{white-space:normal}}   
@media (max-width:640px){.secs{grid-template-columns:1fr}}
@media (max-width:520px){:root{--lane:30px;--railw:96px}.ct{font-size:.86rem}.allbtn{margin-left:0}}

@media (max-width:420px){:root{--lane:22px;--railw:68px}.graph::before{background:var(--railbg)}.here2 b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}


.tick{fill:var(--c)}.tick.soon{opacity:.45}.tick.parked{opacity:.65}
.xring{fill:var(--station);stroke:var(--ink);stroke-width:3.4}.xring.soon{opacity:.6}

const OPEN = new Set();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function fmt(t){ return esc(t).split(/(`[^`]+`)/).map((p, i) => i % 2 ? `<code>${p.slice(1, -1)}</code>` : p.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")).join(""); }

 return ls.map(t => `<li>${fmt(t)}</li>`).join("");

const ABBR = /^(e\.g|i\.e|etc|vs|cf|no|mr|ms|dr|st|v\d+(\.\d+)*)\.$/i;
function sentences(t){
 const out = []; let cur = "";
 String(t).trim().split(/(\s+)/).forEach(p => {
  cur += p;
  const end = p.replace(/[*」』)\]"']+$/, "");
  if (/[.!?]$/.test(end) && !ABBR.test(end)) { out.push(cur.trim()); cur = ""; }

}
function dday(due){
 const today = new Date(); today.setHours(0,0,0,0);
 const d = new Date(due + "T00:00:00"); const left = Math.round((d - today) / 86400000);
 return left > 0 ? `D-${left}` : left === 0 ? "D-day" : `마감 ${-left}일 지남`;
}

function doneDue(n){
 if (!/^\d{2}\/\d{2}$/.test(n.w || "")) return "";
 const d = new Date(n.due + "T00:00:00"), today = new Date(new Date().toDateString()), up = new Date(UPDATED + "T00:00:00");
 const cap = isNaN(up) || up < today ? today : up;


 const at = y => new Date(`${y}-${n.w.replace("/", "-")}T00:00:00`), y0 = d.getFullYear();
 const ws = [y0 - 1, y0, y0 + 1].map(at).filter(x => x <= cap);

}

  ends[n.lane] = n.id;

}

function trainSvg(X, Y){
